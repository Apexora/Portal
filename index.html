<style>
@font-face{font-family:"Arcane Fable";src:url("arcane-fable.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
:root{
  --rosa:#F22F52; --naranja:#F95B45; --hielo:#F1F6F0; --cielo:#49C3E5; --azul:#4764B7; --noche:#1B2A63;
  --bg:#F1F6F0; --ink:#1B2A63;
  --titulo:"Arcane Fable","Cormorant Garamond",Georgia,serif; --texto:"Cormorant Garamond",Georgia,serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#F1F6F0;--ink:#1B2A63}}
:root[data-theme="dark"]{--bg:#F1F6F0;--ink:#1B2A63}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--noche);font-family:"Fraunces","Georgia",serif;color:var(--hielo)}
.hero,.menu{position:fixed;inset:0}
.hero{z-index:2;background:var(--noche);overflow:hidden;will-change:transform}
.menu{z-index:1;background:var(--hielo)}
#scene{position:absolute;inset:0;overflow:hidden}
.lw{position:absolute;left:-8%;top:-8%;width:116%;height:116%;pointer-events:none;will-change:transform}
.lw svg{width:100%;height:100%;display:block;overflow:visible}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(27,42,99,.42) 100%)}
.titulo{isolation:isolate;position:absolute;top:calc(5% + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;pointer-events:none;padding:0 16px}
.titulo::before{content:"";position:absolute;z-index:-1;left:50%;top:-8vh;width:min(120vw,1200px);height:calc(100% + 16vh);transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(10,18,45,.62) 0%,rgba(10,18,45,.35) 45%,transparent 72%)}
.titulo h1{font-family:var(--titulo);font-weight:400;font-size:clamp(2.6rem,8vw,6.2rem);letter-spacing:.05em;color:#fff;text-shadow:0 2px 3px rgba(10,18,45,.85),0 4px 22px rgba(10,18,45,.85),0 0 60px rgba(10,18,45,.6)}
.titulo p{font-family:var(--texto);font-weight:700;margin-top:.35em;font-size:clamp(1.1rem,2.2vw,1.6rem);font-style:italic;letter-spacing:.02em;color:#fff;opacity:1;text-shadow:0 1px 3px rgba(10,18,45,.9),0 2px 14px rgba(10,18,45,.85)}
.go{position:absolute;left:50%;bottom:calc(6% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  font:inherit;font-family:var(--titulo);font-size:1.3rem;letter-spacing:.14em;color:#fff;background:rgba(10,18,45,.5);text-shadow:0 1px 6px rgba(10,18,45,.8);
  border:1.5px solid rgba(255,255,255,.85);box-shadow:0 4px 22px rgba(10,18,45,.45);padding:.8em 2.4em;border-radius:999px;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .35s,color .35s,border-color .35s,padding .35s}
.go:hover,.go:focus-visible{background:var(--hielo);color:var(--rosa);border-color:var(--hielo);text-shadow:none;padding:.8em 3em}
.go:focus-visible,.panel:focus-visible,.volver:focus-visible{outline:3px solid var(--cielo);outline-offset:-4px}

.panel{position:absolute;inset:0;display:block;overflow:hidden;color:var(--hielo);text-decoration:none;background:var(--noche)}
.im{position:absolute;top:0;left:0;height:100%;object-fit:cover;max-width:none;will-change:transform}
.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(14,22,56,.92),rgba(14,22,56,.55) 38%,rgba(14,22,56,0) 66%)}
.glow{position:absolute;inset:0;opacity:0}
.dim{position:absolute;inset:0;background:var(--noche);opacity:0}
.etq{position:absolute;text-align:center;pointer-events:none;width:max-content;max-width:90%}
.etq h2{font-family:var(--titulo);font-weight:400;color:#fff;font-size:clamp(2rem,3.8vw,3.5rem);letter-spacing:.05em;text-shadow:0 2px 3px rgba(10,18,45,.9),0 3px 18px rgba(10,18,45,.85)}
.etq .bar{display:block;height:3px;width:0;margin:.5em auto 0;background:var(--naranja);border-radius:2px}
.etq span{display:block;font-family:var(--texto);font-weight:700;font-style:italic;color:#fff;font-size:clamp(1rem,1.6vw,1.3rem);margin-top:.5em;opacity:0;text-shadow:0 1px 3px rgba(10,18,45,.9),0 2px 12px rgba(10,18,45,.85)}
.volver{position:absolute;z-index:5;top:calc(14px + env(safe-area-inset-top,0px));left:16px;font:inherit;font-family:var(--titulo);font-size:1.05rem;letter-spacing:.06em;color:#fff;
  background:rgba(10,18,45,.7);border:1px solid rgba(241,246,240,.5);border-radius:999px;padding:.45em 1.1em;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.volver:hover{background:var(--rosa);border-color:var(--rosa)}
#bgvideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.lw{display:none}
</style>
</head>
